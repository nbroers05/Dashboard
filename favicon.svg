      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff5fa2"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#16161b"/>
  <rect x="9" y="10" width="46" height="20" rx="6" fill="url(#bar)"/>
  <rect x="9" y="34" width="21" height="20" rx="6" fill="#4fa8ff"/>
  <rect x="34" y="34" width="21" height="20" rx="6" fill="#f5b02e"/>
