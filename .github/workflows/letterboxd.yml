# Fetch data for the dashboard and put it in data/. One Action for everything:
# - every hour (:17): Letterboxd (own logs + friends), and the cinemas once a day
# - every half hour (:17 and :47): feeds (news, film news, YouTube)
# Only commits when something changed. Everything written here is public (GitHub Pages):
# only public data, never tokens or anything personal. Keys are repository secrets.
name: Dashboard data

on:
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: letterboxd
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Each part may fail on its own: the rest carries on
      - name: Letterboxd (every hour)
        if: github.event.schedule != '47 * * * *'
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 .github/scripts/letterboxd.py

      # The script checks itself whether it was already done today (field "day" in data/cinema.json); by hand = always
      - name: Cinemas (once a day)
        if: github.event.schedule != '47 * * * *'
        continue-on-error: true
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python3 .github/scripts/cinema.py

      - name: Feeds (every half hour)
        continue-on-error: true
        run: python3 .github/scripts/feeds.py

      - name: Save if something changed
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "Nothing new"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Dashboard data updated"
          # Noah or Claude may have pushed in the meantime
          git pull --rebase
          git push
