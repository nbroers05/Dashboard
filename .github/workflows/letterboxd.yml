# Data voor het dashboard ophalen en in data/ zetten. Eén Action voor alles:
# - elk uur (:17): Letterboxd (eigen logs + vrienden), en één keer per dag de bioscopen
# - elk half uur (:17 en :47): feeds (nieuws, Reddit, YouTube)
# Commit alleen als er iets veranderd is. Alles wat hier wordt geschreven is openbaar (GitHub Pages):
# alleen publieke data, nooit tokens of iets persoonlijks. Keys staan als repository secret.
name: Dashboard-data

on:
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: letterboxd
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Elk onderdeel mag los mislukken: de rest gaat gewoon door
      - name: Letterboxd (elk uur)
        if: github.event.schedule != '47 * * * *'
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 .github/scripts/letterboxd.py

      - name: Opslaan als er iets veranderd is
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "Niets nieuws"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Dashboard-data bijgewerkt"
          # Noah of Claude kan intussen gepusht hebben
          git pull --rebase
          git push
